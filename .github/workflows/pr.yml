name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Go tools
        run: make install-go-tools

      - name: Install webapp dependencies
        run: cd webapp && npm install

      - name: Run style checks
        run: make check-style

      - name: Install Playwright browsers
        run: cd webapp && npx playwright install --with-deps chromium

      # Server tests use testcontainers-go to spin up postgres:14-alpine.
      # ubuntu-latest runners ship with Docker so no extra setup is needed,
      # but pull the image up-front to give the in-test container start a
      # cached layer and tighter timing.
      - name: Pre-pull Postgres test image
        run: docker pull postgres:14-alpine

      - name: Run tests
        run: make test-ci
        timeout-minutes: 20

      - name: Upload Go test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-report
          path: report.xml
          retention-days: 7

      - name: Build plugin
        run: make dist

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: dist/*.tar.gz
          retention-days: 7
